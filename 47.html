small{display:block;text-align:center;color:#5f6368;font-size:11px;margin-top:8px}

async function analyze(sym){
const k=await J(`${B}/api/v3/klines?symbol=${sym}&interval=1h&limit=200`);
const o=k.map(x=>+x[1]),h=k.map(x=>+x[2]),l=k.map(x=>+x[3]),c=k.map(x=>+x[4]),n=c.length-1,P=c[n];
let t=0;for(let i=n-14;i<n;i++)t+=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));const atr=t/14;

let g=0,ls=0;for(let i=n-13;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:ls-=d}const rsi=ls?100-100/(1+g/ls):100;
const SH=[],SL=[];for(let i=2;i<n-2;i++){if(h[i]>h[i-1]&&h[i]>h[i-2]&&h[i]>h[i+1]&&h[i]>h[i+2])SH.push(i);if(l[i]<l[i-1]&&l[i]<l[i-2]&&l[i]<l[i+1]&&l[i]<l[i+2])SL.push(i)}
const a=SH.slice(-2),b=SL.slice(-2);let sc=0;const nt=[];
if(a.length==2&&b.length==2&&h[a[1]]>h[a[0]]&&l[b[1]]>l[b[0]]){sc+=2;nt.push('tUp')}
else if(a.length==2&&b.length==2&&h[a[1]]<h[a[0]]&&l[b[1]]<l[b[0]]){sc-=2;nt.push('tDn')}
else if(P>e){sc++;nt.push('aE')}else{sc--;nt.push('bE')}
const oldL=SL.filter(i=>i<n-5).slice(-1).map(i=>l[i])[0],oldH=SH.filter(i=>i<n-5).slice(-1).map(i=>h[i])[0];
for(let i=n-5;i<n;i++){if(oldL&&l[i]<oldL&&c[i]>oldL){sc+=2;nt.push('swL');break}if(oldH&&h[i]>oldH&&c[i]<oldH){sc-=2;nt.push('swH');break}}
for(let i=n-1;i>n-40;i--){if(l[i]>h[i-2]&&Math.min(...l.slice(i+1))>=h[i-2]&&P>h[i-2]&&P-l[i]<2*atr){sc++;nt.push('fB');break}
if(h[i]<l[i-2]&&Math.max(...h.slice(i+1))<=l[i-2]&&P<l[i-2]&&h[i]-P<2*atr){sc--;nt.push('fS');break}}
for(let i=n-1;i>n-40;i--){if(c[i]-o[i]>1.5*atr&&c[i-1]<o[i-1]&&P>=l[i-1]&&P<=h[i-1]+atr){sc++;nt.push('oB');break}
if(o[i]-c[i]>1.5*atr&&c[i-1]>o[i-1]&&P<=h[i-1]&&P>=l[i-1]-atr){sc--;nt.push('oS');break}}
const hi=Math.max(...h.slice(-50)),lo=Math.min(...l.slice(-50));if(P<(hi+lo)/2){sc++;nt.push('dc')}else{sc--;nt.push('pm')}
const i=n-1,bd=Math.abs(c[i]-o[i]),rg=h[i]-l[i]||1,lw=Math.min(o[i],c[i])-l[i],uw=h[i]-Math.max(o[i],c[i]);
if(c[i]>o[i]&&c[i-1]<o[i-1]&&c[i]>=o[i-1]&&o[i]<=c[i-1]){sc++;nt.push('eB')}else if(c[i]<o[i]&&c[i-1]>o[i-1]&&c[i]<=o[i-1]&&o[i]>=c[i-1]){sc--;nt.push('eS')}
else if(lw>2*bd&&lw>.6*rg){sc++;nt.push('pB')}else if(uw>2*bd&&uw>.6*rg){sc--;nt.push('pS')}

function eth(d){const j=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+2440588,r=(j-1723856)%1461,n=r%365+365*Math.floor(r/1460);return{y:4*Math.floor((j-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30),d:n%30+1}}

function dateTxt(){const d=new Date(),e=eth(d),tm=d.toLocaleTimeString('en-GB',{timeZone:'Africa/Addis_Ababa',hour:'2-digit',minute:'2-digit'}),u=d.getUTCHours();
const g=d.toLocaleDateString(lang=='en'?'en-GB':'en-GB',{day:'numeric',month:'long',year:'numeric'});
const kz=(u>=7&&u<10)?'London Killzone':(u>=12&&u<15)?'New York Killzone':(u>=0&&u<9)?'Asia session':'—';
const L={om:`Har\u2019a: <b>${EM.om[e.m]} ${e.d}, ${e.y}</b> (Itoophiyaa)\nGregorian: ${g}\nSa\u2019aatii Finfinnee: <b>${tm}</b>\nSession amma: ${kz}\n(London KZ 10:00–13:00, NY KZ 15:00–18:00 sa\u2019aa Itoophiyaa)`,am:`ዛሬ፦ <b>${EM.am[e.m]} ${e.d}፣ ${e.y} ዓ.ም</b>\nግሪጎሪያን፦ ${g}\nየአዲስ አበባ ሰዓት፦ <b>${tm}</b>\nአሁን ያለው ሴሽን፦ ${kz}\n(London KZ 10:00–13:00፣ NY KZ 15:00–18:00 በኢትዮጵያ ሰዓት)`,en:`Today: <b>${EM.en[e.m]} ${e.d}, ${e.y} E.C.</b> (Ethiopian)\nGregorian: ${g}\nAddis time: <b>${tm}</b>\nCurrent session: ${kz}\n(London KZ 10:00–13:00, NY KZ 15:00–18:00 Ethiopian time)`};return L[lang]}
const KB={naol:{om:'<b>Naol</b> barataa kutaa 12ffaa fi forex trader Godina Gujii, Oromiyaa keessa jiru dha. Ani Naol Trader — gargaaraa trade isaa 💙',am:'<b>ናኦል</b> የ12ኛ ክፍል ተማሪ እና በኦሮሚያ ጉጂ የሚገኝ ፎሬክስ ትሬደር ነው። እኔ የእሱ ረዳት ናኦል ትሬደር ነኝ 💙',en:'<b>Naol</b> is a grade 12 student and forex trader in Guji, Oromia. I\u2019m Naol Trader, his trading assistant 💙'},
ict:{om:'<b>ICT</b> (Inner Circle Trader) — bankiin gurguddaan liquidity (stop loss namootaa) hordofa.\n• <b>Liquidity sweep</b>: gatiin high/low duraa butee deebi\u2019a\n• <b>FVG</b>: candle 3 gidduu gatiin hin daddaabbatin\n• <b>Order Block</b>: candle dhumaa kan fuulduratti sochii cimaan dhufe\n• <b>Premium/Discount</b>: range keessatti gatii 50% olii/gadii\nBuy: Discount + sweep gadii + FVG/OB. Sell: faallaa isaa.',am:'<b>ICT</b> (Inner Circle Trader) — ትልልቅ ባንኮች ሊኩዊዲቲን (የሰዎች stop loss) ያድናሉ።\n• <b>Liquidity sweep</b>፦ ዋጋ የቀድሞ high/low ጠርጎ ይመለሳል\n• <b>FVG</b>፦ በ3 ሻማ መካከል ያልተነካ ክፍተት\n• <b>Order Block</b>፦ ከጠንካራ እንቅስቃሴ በፊት ያለ የመጨረሻ ተቃራኒ ሻማ\n• <b>Premium/Discount</b>፦ ከክልሉ 50% በላይ/በታች\nBuy፦ Discount + ታች sweep + FVG/OB። Sell፦ ተቃራኒው።',en:'<b>ICT</b> (Inner Circle Trader): big players hunt liquidity (retail stop losses).\n• <b>Liquidity sweep</b>: price takes an old high/low, then reverses\n• <b>FVG</b>: untouched gap across 3 candles\n• <b>Order Block</b>: last opposite candle before a strong move\n• <b>Premium/Discount</b>: above/below 50% of the range\nBuy: Discount + sell-side sweep + FVG/OB. Sell: the opposite.'},
hi:{om:'Akkam jirta! 😊 Gabaa ilaaluu dandeenya — pair filadhu, Buy ykn Sell tuqi, ani TP fi SL siif herrega.',am:'ሰላም! 😊 ገበያውን እንይ — ጥንድ ምረጥ፣ Buy ወይም Sell ጫን፣ TP እና SL አስላልሃለሁ።',en:'Hey there! 😊 Pick a pair, tap Buy or Sell, and I\u2019ll work out TP and SL for you.'},
nf:{om:'Hubadheera 🙂 Pair (BTC, ETH, Gold, EUR…) fi Buy/Sell naaf barreessi, ykn "gabaan har\u2019a akkam?" jedhi.',am:'ገብቶኛል 🙂 ጥንድ (BTC, ETH, Gold, EUR…) እና Buy/Sell ጻፍልኝ፣ ወይም "ዛሬ ገበያው እንዴት ነው?" በል።',en:'Got it 🙂 Tell me a pair (BTC, ETH, Gold, EUR…) with Buy/Sell, or ask "how is the market today?".'},
er:{om:'Dhiifama, data live fiduu hin dandeenye. Interneetii ilaali, irra deebi\u2019i 🙏',am:'ይቅርታ፣ ወቅታዊ መረጃ ማምጣት አልቻልኩም። ኢንተርኔትህን አረጋግጥ 🙏',en:'Sorry, I couldn\u2019t fetch live data. Check your connection and try again 🙏'}};
async function overview(){const q=encodeURIComponent(JSON.stringify(Object.keys(PAIRS))),d=await J(`${B}/api/v3/ticker/24hr?symbols=${q}&type=MINI`);
const hd={om:'Gabaan har\u2019a (sa\u2019aatii 24):',am:'የዛሬ ገበያ (24 ሰዓት)፦',en:'Market now (24h):'}[lang];
return hd+'\n'+d.map(x=>{const ch=(x.lastPrice-x.openPrice)/x.openPrice*100;return`${ch>=0?'🟢':'🔴'} <b>${PAIRS[x.symbol]}</b> ${f(+x.lastPrice)} <span class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span>`}).join('\n')}
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=cls=='u'?`<div class="bb">${html}</div>`:`<div class="av"></div><div class="bb">${html}</div>`;$('#log').appendChild(d);$('#chat').scrollTop=1e9;return d.querySelector('.bb')}
function say(h){if(!speak||!window.speechSynthesis)return;const tx=h.replace(/<[^>]+>/g,' ').replace(/[•🟢🔴👀🙏💙😊🙂]/g,'');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tx),pf={am:['am','en'],om:['om','sw','en'],en:['en']}[lang],v=speechSynthesis.getVoices();
for(const p of pf){const m=v.find(x=>x.lang.toLowerCase().startsWith(p));if(m){u.voice=m;u.lang=m.lang;break}}speechSynthesis.speak(u)}
async function ask(raw){const q=raw.trim();if(!q)return;$('#hero').style.display='none';add('u',esc(q));const bb=add('b','<span class="dots"><span></span><span></span><span></span></span>');
const s=q.toLowerCase();let sym=null;for(const k in AL)if(s.includes(k)){sym=AL[k];break}for(const k in PAIRS)if(s.includes(k.toLowerCase())){sym=k}
let side=/\b(buy|bitaa|bitadhu|bitachuu|long)\b|ግዛ|ግዢ|መግዛት/.test(s)?'BUY':/\b(sell|gurgur\w*|short)\b|ሽጥ|ሽያጭ|መሸጥ/.test(s)?'SELL':null;
let out;try{
if(/naol|ናኦል/.test(s)&&/eenyu|who|ማነው|maal|about/.test(s))out=KB.naol[lang];
else if(/\bict\b|fvg|order block|price action|liquidity/.test(s))out=KB.ict[lang];
else if(/kaalaandar|calendar|ቀን|guyyaa|date|session|sa.aa|ሰዓት|time|today.s/.test(s)&&!sym)out=dateTxt();
else if(sym||(side&&!sym)){sym=sym||cur;cur=sym;$('#pair').value=sym;bb.innerHTML=UI[lang].load+' <span class="dots"><span></span><span></span><span></span></span>';out=report(await analyze(sym),side)}
else if(/gabaa|market|ገበያ|overview/.test(s))out=await overview();
else if(/^(hi|hello|hey|akkam|salaam|selam|ሰላም|ሀሎ)/.test(s))out=KB.hi[lang];
else out=KB.nf[lang]}catch(e){out=KB.er[lang]}
bb.innerHTML='';const tmp=document.createElement('div');tmp.innerHTML=out;bb.innerHTML=out;bb.style.animation='in .4s';$('#chat').scrollTop=1e9;say(out)}
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));const u=UI[l];$('#h1').textContent=u.h1;$('#h2').textContent=u.h2;$('#in').placeholder=u.ph;$('#dis').textContent=u.dis;
$('#chips').innerHTML=u.chips.map(c=>`<button>${c}</button>`).join('');$('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent))}
$('#pair').innerHTML=Object.entries(PAIRS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#pair').onchange=e=>cur=e.target.value;
$('#bB').onclick=()=>ask(`${PAIRS[$('#pair').value]} buy ${$('#pair').value}`);$('#bS').onclick=()=>ask(`${PAIRS[$('#pair').value]} sell ${$('#pair').value}`);
$('#go').onclick=()=>{const v=$('#in').value;$('#in').value='';ask(v)};$('#in').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#spk').onclick=()=>{speak=!speak;$('#spk').textContent=speak?'🔊':'🔇';if(!speak)speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('#mic').onclick=()=>{if(!SR){alert('Voice input: use Chrome / Edge');return}if(rec){rec.stop();return}rec=new SR();rec.lang={am:'am-ET',om:'om-ET',en:'en-US'}[lang];
rec.onstart=()=>$('#mic').classList.add('on');rec.onend=()=>{$('#mic').classList.remove('on');rec=null};rec.onerror=()=>{};
rec.onresult=e=>{speak=true;$('#spk').textContent='🔊';ask(e.results[0][0].transcript)};rec.start()};
let last=0;async function tick(){try{const d=await J(`${B}/api/v3/ticker/price?symbol=${cur}`),p=+d.price,el=$('#tick');el.innerHTML=`${PAIRS[cur]} <b>${f(p)}</b>`;el.classList.remove('up','dn');if(last)el.classList.add(p>=last?'up':'dn');last=p}catch(e){}}
$('#pair').addEventListener('change',()=>last=0);setLang('om');tick();setInterval(tick,5000);
</script></body></html>
